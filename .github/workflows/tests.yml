name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          # pdo_pgsql is required by console/composer.json. Without it the
          # console install fails on platform requirements, which reads as an
          # unrelated dependency error rather than a missing extension.
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests
        run: ./vendor/bin/phpunit

      # The provisioning console is a separate app with its own dependency tree.
      # Only its credential-free half runs here; the Feature half needs a live
      # Supabase project and stays a developer-machine gate.
      - name: Install Console Dependencies
        run: composer install --working-dir=console --no-interaction --prefer-dist --optimize-autoloader

      # --fail-on-skipped, not politeness: Tests\TestCase skips itself without
      # credentials, so a suite that silently became credential-gated would exit
      # 0 having run nothing. Green here has to mean the tests executed.
      - name: Console Tests (credential-free)
        run: console/vendor/bin/phpunit -c console/phpunit.xml --testsuite=Unit --fail-on-skipped
